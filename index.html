<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="styles/styles.css">
    <title>HTML Responsive Images - Week 4</title>
  </head>
  <body>
    <div class="container">
    <header>
        <h1>HTML Responsive Images</h1>
    </header>
    <main>
        <section class="back-sizer">
          <!-- we're using this section to play with background images -->
        </section>
        <section class="srcset-test">
            <!-- this section is for playing with srcset -->
             <!-- the srcset attribute lets you give a set of images to the browser,
                  to choose the best one based on a set of conditions (in this case pixel density -1x, 2x, or 3x) -->
            <img 
            src="images/puppy-1.0.jpg"
             alt="A white puppy standing in short grass"
             srcset="images/puppy-1.0.jpg 1x,
                     images/puppy-2.0.jpg 2x,
                     images/puppy-3.0.jpg 3x">
        </section>

        <section class="picture-test">
          <!-- this section is for playing with the picture element -->
           <picture>
            <!-- picture lets you use different images at different sizes -->
            <source srcset="images/puppy-1200.jpg"
                    media="(min-width: 700px)">
            <!-- <source srcset="images/puppy-600.jpg"
                    media="(max-width: 699px)"> -->

                    <!-- you always need a fallback - the img tag - just in case the picture tag doesn't work
                     and supply the alt text -->
            <img src="images/puppy-600.jpg"
             alt="A white puppy standing in short grass">
           </picture>
        </section>
    </main>
    <footer>
        <p>Image by <a href="https://pixabay.com/users/cparks-1593059/?utm_source=link-attribution&utm_medium=referral&utm_campaign=image&utm_content=5124947">Cindy Parks</a> from <a href="https://pixabay.com//?utm_source=link-attribution&utm_medium=referral&utm_campaign=image&utm_content=5124947">Pixabay</a></p>
    </footer>
    </div>
  </body>
</html>
